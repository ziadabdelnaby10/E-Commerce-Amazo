spring:
  application:
    name: order-service
  # Everything else (datasource, kafka, security, ports) comes from config-service so a single
  # source of truth drives every environment. The previous local copies were removed because
  # duplicated defaults silently drift and mask what the config server actually serves.
  config:
    import: optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}
