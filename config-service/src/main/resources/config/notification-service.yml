spring:
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5434}/${NOTIFICATION_DB_NAME:notification_db}
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:rootroot}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:5}
      idle-timeout: 30000
      max-lifetime: 1200000
      connection-timeout: 20000
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    baseline-on-migrate: true
    enabled: true
    baseline-description: "init"
    baseline-version: 0
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      acks: all
      retries: 3
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS:false}

server:
  port: ${SERVER_PORT:9005}
  servlet:
    context-path: /api

application:
  config:
    from-address: ${MAIL_FROM_ADDRESS:no-reply@ecommerce.local}
  kafka:
    topics:
      order-events: order-events
      payment-events: payment-events
      notification-events: notification-events
      notification-events-dlq: notification-events-dlq
    consumers:
      order-group-id: notification-service-orders
      payment-group-id: notification-service-payments
  retry:
    batch-size: 100
    fixed-delay-ms: 30000
    base-delay-minutes: 5
  security:
    enabled: true
    jwt:
      secret: ${JWT_SECRET}
      issuer: ${JWT_ISSUER:ecommerce-platform}
      access-token-ttl: ${JWT_ACCESS_TTL:15m}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
