# Development overlay: applied when SPRING_PROFILES_ACTIVE=dev.
#
# Optimised for feedback speed and debuggability, never for safety. Anything that would be
# unacceptable in production (SQL logging, full health details, permissive CORS) belongs here
# and only here.

spring:
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    org.ecommerce: debug
    org.springframework.web: info
    org.hibernate.orm.jdbc.bind: trace

management:
  endpoints:
    web:
      exposure:
        # Everything is exposed locally so /actuator/env, /actuator/beans etc. are available
        # while debugging. Deliberately not done in prod.
        include: "*"
  endpoint:
    health:
      show-details: always

