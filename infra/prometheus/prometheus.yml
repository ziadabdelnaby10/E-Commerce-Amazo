global:
  scrape_interval: 10s
  evaluation_interval: 10s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: [ 'localhost:9090' ]

  # Platform services: no context-path.
  - job_name: 'platform-services'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets:
          - 'config-service:8888'
          - 'discovery-service:8761'
          - 'gateway-service:9080'
        labels:
          tier: 'platform'

  # Business services: all mounted under the /api context-path.
  - job_name: 'business-services'
    metrics_path: '/api/actuator/prometheus'
    static_configs:
      - targets:
          - 'customer-service:9001'
          - 'inventory-service:9002'
          - 'order-service:9003'
          - 'payment-service:9004'
          - 'notification-service:9005'
        labels:
          tier: 'business'
