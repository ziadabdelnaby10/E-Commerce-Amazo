spring:
  application:
    # Logical service name used by Spring Cloud Config and service discovery integration.
    name: gateway-service
  config:
    # Load service-specific remote configuration from config-service.
    import: optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}

logging:
  level:
    # Verbose security tracing is a development aid: the dev profile turns it on, prod leaves
    # it at info because it logs token handling detail that does not belong in prod logs.
    org.springframework.security: ${SECURITY_LOG_LEVEL:info}
