name: Unit Tests (PR)

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.detect.outputs.services }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed services
        id: detect
        shell: bash
        run: |
          set -euo pipefail

          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"

          CHANGED_FILES=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")
          echo "Changed files:"
          echo "$CHANGED_FILES"

          ALL_SERVICES=(
            "config-service"
            "customer-service"
            "discovery-service"
            "gateway-service"
            "inventory-service"
            "notification-service"
            "order-service"
            "payment-service"
          )

          SHARED_CHANGE=false
          while IFS= read -r file; do
            [[ -z "$file" ]] && continue
            if [[ "$file" == .github/* || "$file" == docs/* || "$file" == docker-compose.yml || "$file" == README.md || "$file" == ports.txt ]]; then
              SHARED_CHANGE=true
              break
            fi
          done <<< "$CHANGED_FILES"

          if [[ "$SHARED_CHANGE" == "true" ]]; then
            SERVICES_JSON=$(printf '%s\n' "${ALL_SERVICES[@]}" | jq -R . | jq -cs .)
            echo "services=$SERVICES_JSON" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          MATCHED=()
          for service in "${ALL_SERVICES[@]}"; do
            if echo "$CHANGED_FILES" | grep -qE "^${service}/"; then
              MATCHED+=("$service")
            fi
          done

          if [[ ${#MATCHED[@]} -eq 0 ]]; then
            echo "services=[]" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          SERVICES_JSON=$(printf '%s\n' "${MATCHED[@]}" | jq -R . | jq -cs .)
          echo "services=$SERVICES_JSON" >> "$GITHUB_OUTPUT"

  unit-tests:
    needs: detect-changes
    if: needs.detect-changes.outputs.services != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJson(needs.detect-changes.outputs.services) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Make Maven wrapper executable
        shell: bash
        run: chmod +x "${{ matrix.service }}/mvnw"

      - name: Run fast unit tests
        working-directory: ${{ matrix.service }}
        shell: bash
        run: ./mvnw -B clean test

