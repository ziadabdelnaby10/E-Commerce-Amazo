name: CI Matrix

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect-services:
    name: Detect changed services
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.build-matrix.outputs.matrix }}
      has-services: ${{ steps.build-matrix.outputs.has-services }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Build matrix from git diff
        id: build-matrix
        shell: bash
        run: |
          set -euo pipefail

          all_services=(
            "config-service"
            "customer-service"
            "discovery-service"
            "gateway-service"
          )

          changed_files=""

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            changed_files="ALL"
          elif [[ "${{ github.event_name }}" == "pull_request" ]]; then
            base_sha="${{ github.event.pull_request.base.sha }}"
            head_sha="${{ github.event.pull_request.head.sha }}"
            changed_files="$(git diff --name-only "$base_sha" "$head_sha")"
          else
            base_sha="${{ github.event.before }}"
            head_sha="${{ github.sha }}"

            # First push to a branch can have an empty before SHA.
            if [[ "$base_sha" == "0000000000000000000000000000000000000000" ]]; then
              changed_files="ALL"
            else
              changed_files="$(git diff --name-only "$base_sha" "$head_sha")"
            fi
          fi

          CHANGED_FILES="$changed_files" python - <<'PY'
          import json
          import os
          import pathlib

          all_services = [
              "config-service",
              "customer-service",
              "discovery-service",
              "gateway-service",
          ]

          changed_files_raw = os.environ.get("CHANGED_FILES", "")

          if changed_files_raw == "ALL":
              selected = all_services
          else:
              changed = [line.strip() for line in changed_files_raw.splitlines() if line.strip()]

              shared_prefixes = (
                  ".github/",
                  "docs/",
                  "postgres/",
                  "infra/",
              )
              shared_files = {
                  "README.md",
                  "docker-compose.yml",
                  "ports.txt",
              }

              run_all = any(
                  f.startswith(shared_prefixes) or f in shared_files
                  for f in changed
              )

              if run_all:
                  selected = all_services
              else:
                  selected = []
                  for service in all_services:
                      prefix = f"{service}/"
                      if any(f.startswith(prefix) for f in changed):
                          selected.append(service)

          matrix = {"service": selected}
          has_services = "true" if selected else "false"

          output_file = pathlib.Path(os.environ["GITHUB_OUTPUT"])
          with output_file.open("a", encoding="utf-8") as fh:
              fh.write(f"matrix={json.dumps(matrix)}\\n")
              fh.write(f"has-services={has_services}\\n")
          PY

  pr-unit-tests:
    name: PR unit tests (${{ matrix.service }})
    needs: detect-services
    if: github.event_name == 'pull_request' && needs.detect-services.outputs.has-services == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.detect-services.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run unit tests
        working-directory: ${{ matrix.service }}
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./mvnw
          ./mvnw -B -ntp clean test

  main-verify:
    name: Main verify (${{ matrix.service }})
    needs: detect-services
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.detect-services.outputs.has-services == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.detect-services.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run verify
        working-directory: ${{ matrix.service }}
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./mvnw
          ./mvnw -B -ntp clean verify



