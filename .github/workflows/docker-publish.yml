name: Docker Publish

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - config-service
          - customer-service
          - discovery-service
          - gateway-service
          - inventory-service
          - notification-service
          - order-service
          - payment-service

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Make Maven wrapper executable
        shell: bash
        run: chmod +x "${{ matrix.service }}/mvnw"

      - name: Build service JAR
        working-directory: ${{ matrix.service }}
        shell: bash
        run: ./mvnw -B clean package -DskipTests

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Compute Docker tags
        id: tags
        shell: bash
        run: |
          set -euo pipefail
          IMAGE="ziadabdelnaby/amazo-ecommerce"
          SERVICE="${{ matrix.service }}"
          SHORT_SHA="${GITHUB_SHA::7}"

          TAGS="${IMAGE}:${SERVICE}-sha-${SHORT_SHA}"

          if [[ "${GITHUB_REF_TYPE}" == "branch" && "${GITHUB_REF_NAME}" == "main" ]]; then
            TAGS="${TAGS}\n${IMAGE}:${SERVICE}-latest"
          fi

          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            TAGS="${TAGS}\n${IMAGE}:${SERVICE}-${GITHUB_REF_NAME}"
          fi

          printf 'tags<<EOF\n%b\nEOF\n' "$TAGS" >> "$GITHUB_OUTPUT"

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.service }}
          file: ${{ matrix.service }}/Dockerfile
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

