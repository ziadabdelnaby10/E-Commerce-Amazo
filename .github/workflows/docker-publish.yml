name: Docker Publish

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE: ziadabdelnaby/amazo-ecommerce

jobs:
  # Catch compose mistakes before spending ~10 minutes building eight images. `config` fully
  # interpolates and validates both stacks, so a typo in a service name or a missing variable
  # fails here in seconds instead of at deploy time.
  validate-compose:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate development stack
        run: docker compose --env-file .env.dev -f docker-compose.yml -f docker-compose.app.yml config --quiet

      - name: Validate production stack
        # .env.prod is git-ignored, so validation runs against the committed template instead.
        run: docker compose --env-file .env.example -f docker-compose.yml -f docker-compose.prod.yml config --quiet

  publish:
    needs: validate-compose
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - config-service
          - customer-service
          - discovery-service
          - gateway-service
          - inventory-service
          - notification-service
          - order-service
          - payment-service

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The Dockerfiles are multi-stage and compile inside the build container, so the runner
      # needs neither a JDK nor Maven - only Docker. The previous setup-java / mvnw package
      # steps are gone for that reason.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # A single Docker Hub repository holds every service, so the service name has to live in
      # the tag rather than in the repository path.
      - name: Compute image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,prefix=${{ matrix.service }}-sha-,format=short
            type=raw,value=${{ matrix.service }}-latest,enable={{is_default_branch}}
            type=ref,event=tag,prefix=${{ matrix.service }}-
          labels: |
            org.opencontainers.image.title=${{ matrix.service }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.service }}
          file: ${{ matrix.service }}/Dockerfile
          push: true
          # arm64 lets the same tag run on Apple Silicon and Graviton hosts.
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Scoped per service so the eight parallel jobs do not evict each other's Maven layer
          # cache, which is what makes the per-service dependency download affordable.
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
